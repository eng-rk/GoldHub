name: Terraform

on:
  pull_request:
    paths:
      - 'youstina-terraform/**'
  workflow_dispatch: {}

jobs:
  terraform:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Initialize Terraform
        working-directory: youstina-terraform
        run: terraform init -input=false

      - name: Format Terraform code
        working-directory: youstina-terraform
        run: terraform fmt -recursive

      - name: Validate Terraform files
        working-directory: youstina-terraform
        run: terraform validate

      - name: Run Terraform plan
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && secrets.AWS_DEFAULT_REGION }}
        working-directory: youstina-terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: terraform plan -input=false

      - name: Skip Terraform plan
        if: ${{ !secrets.AWS_ACCESS_KEY_ID || !secrets.AWS_SECRET_ACCESS_KEY || !secrets.AWS_DEFAULT_REGION }}
        run: |
          echo "Skipping Terraform plan because AWS credentials are not configured."
          echo "Set AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and AWS_DEFAULT_REGION in repository secrets to enable plan execution."

  terraform_apply:
    name: Terraform Apply
    needs: terraform
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Initialize Terraform
        working-directory: youstina-terraform
        run: terraform init -input=false

      - name: Apply Terraform configuration
        working-directory: youstina-terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: terraform apply -input=false -auto-approve
